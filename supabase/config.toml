# NullReferMusic Supabase (로컬 CLI용 — 원격 프로젝트와 연동 시 supabase link)
project_id = "bwkiaapffroyveqqjhom"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[functions.musicbrainz-sync]
# The function performs constant-time validation of MUSICBRAINZ_CRON_TOKEN.
# pg_cron does not send a Supabase user JWT.
verify_jwt = false

[functions.music-admin-capacity]
# The app calls this with the publishable key, which is not a user JWT.
# Admin access is checked inside the function via nrm_is_admin_caller.
verify_jwt = false
