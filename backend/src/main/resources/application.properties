server.port=${NRM_SERVER_PORT:8787}
server.address=${NRM_BIND_HOST:0.0.0.0}

spring.application.name=nullreference-music-backend

# 클래스패스 변경 시 자동 재시작 (mvn spring-boot:run + IDE/빌드로 .class 갱신될 때)
spring.devtools.restart.enabled=true

nrm.repo-root=${NRM_REPO_ROOT:}
nrm.yt-dlp-path=${NRM_YT_DLP:}
nrm.ffmpeg-dir=${NRM_FFMPEG_DIR:}
nrm.output-dir=${NRM_OUTPUT_DIR:}
nrm.youtube-api-key=${NRM_YOUTUBE_API_KEY:}
